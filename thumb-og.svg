<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E2747"/>
      <stop offset="100%" stop-color="#081730"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#E8C988"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Eyebrow -->
  <text x="80" y="120"
        font-family="Georgia, serif"
        font-size="18"
        font-weight="600"
        letter-spacing="5"
        fill="#C9A961">MIZAN · HALAL INVESTING</text>

  <!-- Main statement -->
  <text x="80" y="260"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76"
        font-weight="700"
        fill="#F4ECD8">Show the math.</text>
  <text x="80" y="345"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="76"
        font-weight="700"
        fill="#F4ECD8">Cite the source.</text>

  <!-- Gold accent line -->
  <rect x="80" y="380" width="180" height="3" fill="url(#gold)"/>

  <!-- Subline -->
  <text x="80" y="435"
        font-family="Georgia, serif"
        font-size="26"
        font-style="italic"
        fill="#B8C5D6">Six scholarly profiles. Every threshold cited.</text>
  <text x="80" y="470"
        font-family="Georgia, serif"
        font-size="26"
        font-style="italic"
        fill="#B8C5D6">The only screener that implements Mufti Taqi&apos;s rule.</text>

  <!-- URL bottom-left -->
  <text x="80" y="560"
        font-family="'SF Mono', Menlo, monospace"
        font-size="18"
        letter-spacing="2"
        fill="#8FA3BF">mizaninvesting.com</text>

  <!-- Big M monogram bottom-right -->
  <text x="1080" y="500"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="380"
        font-weight="700"
        fill="#C9A961"
        fill-opacity="0.22"
        text-anchor="middle">M</text>
</svg>
