<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="55%" stop-color="#0E2747"/>
      <stop offset="100%" stop-color="#081730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#1A3563" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0B1F3A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A961"/>
      <stop offset="100%" stop-color="#E8C988"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bg)"/>
  <rect width="1584" height="396" fill="url(#glow)"/>

  <!-- Subtle horizontal lines, editorial texture -->
  <g stroke="#FFFFFF" stroke-opacity="0.025">
    <line x1="0" y1="60" x2="1584" y2="60" stroke-width="1"/>
    <line x1="0" y1="336" x2="1584" y2="336" stroke-width="1"/>
  </g>

  <!-- Top eyebrow label, right side -->
  <text x="1500" y="92"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14"
        font-weight="600"
        letter-spacing="4.5"
        fill="#C9A961"
        text-anchor="end">MIZAN · HONG KONG</text>

  <!-- Main statement (right-aligned, mid-banner) -->
  <text x="1500" y="200"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64"
        font-weight="700"
        fill="#F4ECD8"
        text-anchor="end">Show the math.</text>
  <text x="1500" y="270"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="64"
        font-weight="700"
        fill="#F4ECD8"
        text-anchor="end">Cite the source.</text>

  <!-- Gold accent line -->
  <rect x="1320" y="295" width="180" height="2" fill="url(#gold)"/>

  <!-- Subline -->
  <text x="1500" y="330"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="20"
        font-style="italic"
        fill="#B8C5D6"
        text-anchor="end">Multi-scholar halal investing screener</text>

  <!-- URL bottom-right -->
  <text x="1500" y="365"
        font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="13"
        letter-spacing="1.5"
        fill="#8FA3BF"
        text-anchor="end">mizaninvesting.com</text>

  <!-- Left side: subtle balance scale glyph (the "mizan" / balance symbol) -->
  <!-- Positioned where the profile photo will NOT cover it (upper-left) -->
  <g transform="translate(110, 110)" stroke="#C9A961" stroke-opacity="0.35" fill="none" stroke-width="2" stroke-linecap="round">
    <!-- vertical stand -->
    <line x1="60" y1="10" x2="60" y2="90"/>
    <!-- crossbar -->
    <line x1="10" y1="30" x2="110" y2="30"/>
    <!-- left pan strings -->
    <line x1="20" y1="30" x2="10" y2="55"/>
    <line x1="20" y1="30" x2="30" y2="55"/>
    <!-- right pan strings -->
    <line x1="100" y1="30" x2="90" y2="55"/>
    <line x1="100" y1="30" x2="110" y2="55"/>
    <!-- left pan -->
    <path d="M 5 55 Q 20 70 35 55" />
    <!-- right pan -->
    <path d="M 85 55 Q 100 70 115 55" />
    <!-- base -->
    <line x1="45" y1="90" x2="75" y2="90"/>
  </g>
</svg>
