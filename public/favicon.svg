<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="HalalGauge">
  <defs>
    <linearGradient id="hg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26543F"/>
      <stop offset="1" stop-color="#19402F"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#hg-bg)"/>

  <!-- gauge: bold speedometer arc reading into the green "halal" zone -->
  <g fill="none" stroke-linecap="round">
    <!-- muted track (left + top of sweep) -->
    <path d="M62 190 A78 78 0 0 1 167 84" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="20"/>
    <!-- green pass zone (right of sweep) -->
    <path d="M167 84 A78 78 0 0 1 194 190" stroke="#34D17F" stroke-width="20"/>
  </g>

  <!-- needle pointing into the green zone -->
  <g stroke="#E0AC45" stroke-linecap="round">
    <line x1="128" y1="150" x2="178" y2="115" stroke-width="13"/>
    <line x1="128" y1="150" x2="114" y2="160" stroke-width="13"/>
  </g>
  <!-- hub -->
  <circle cx="128" cy="150" r="14" fill="#E0AC45"/>
  <circle cx="128" cy="150" r="5.5" fill="#19402F"/>
</svg>
