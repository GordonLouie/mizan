<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Left half navy -->
  <rect width="500" height="630" fill="#0B1F3A"/>
  <!-- Right half cream -->
  <rect x="500" width="700" height="630" fill="#F4ECD8"/>

  <!-- Left: large wordmark on navy -->
  <text x="250" y="345"
        font-family="Liberation Serif, Georgia, 'Times New Roman', serif"
        font-size="92"
        font-weight="400"
        fill="#F4ECD8"
